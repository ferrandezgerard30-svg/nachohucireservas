<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nacho Huici · Reserva de citas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #f0ece4;
      --cream-mid: #e8e2d8;
      --warm-mid: #d6cfc3;
      --brown-dark: #3a2e26;
      --brown-med:  #6b5647;
      --brown-light: #a08070;
      --text-main: #2e2620;
      --text-soft: #7a6a5e;
      --border:   #cfc8bc;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── LANGUAGE SWITCHER ── */
    .lang-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 40px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }

    .lang-switcher {
      display: flex;
      gap: 4px;
    }

    .lang-btn {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: 1px solid transparent;
      color: var(--brown-light);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .lang-btn:hover {
      color: var(--brown-dark);
      border-color: var(--border);
    }

    .lang-btn.active {
      background: var(--brown-dark);
      color: var(--cream);
      border-color: var(--brown-dark);
    }

    /* ── MAIN LAYOUT ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* ── LOGO ── */
    .logo-wrap {
      margin-bottom: 24px;
      text-align: center;
      animation: fadeUp 0.8s ease both;
    }

    .logo-img {
      width: 420px;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 48px 44px 44px;
      animation: fadeUp 0.9s 0.1s ease both;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 44px; right: 44px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--brown-light), transparent);
    }

    .card-eyebrow {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brown-light);
      margin-bottom: 10px;
      text-align: center;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.2;
    }

    .card-title em {
      font-style: italic;
      color: var(--brown-med);
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-main);
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--brown-med);
      background: #fff;
    }

    .form-input::placeholder {
      color: var(--warm-mid);
    }

    /* ── REMEMBER ME ── */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .remember-row input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: var(--brown-dark);
      cursor: pointer;
    }

    .remember-row label {
      font-size: 12px;
      color: var(--text-soft);
      cursor: pointer;
    }

    /* ── SUBMIT BUTTON ── */
    .btn-primary {
      width: 100%;
      background: var(--brown-dark);
      color: var(--cream);
      border: none;
      border-radius: 2px;
      padding: 14px 24px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-bottom: 24px;
    }

    .btn-primary:hover {
      background: var(--brown-med);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* ── LINKS ── */
    .card-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .card-link {
      font-size: 12px;
      color: var(--brown-light);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .card-link:hover {
      color: var(--brown-dark);
    }

    .card-link.register {
      font-weight: 500;
      color: var(--brown-med);
    }

    /* ── DIVIDER ── */
    .divider {
      color: var(--warm-mid);
      font-size: 11px;
    }

    /* ── FOOTER INFO ── */
    .foot-info {
      margin-top: 40px;
      text-align: center;
      animation: fadeUp 1s 0.25s ease both;
    }

    .foot-address {
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    .foot-address a {
      color: var(--brown-med);
      text-decoration: none;
      font-weight: 400;
    }

    .foot-sep {
      display: inline-block;
      margin: 0 8px;
      color: var(--warm-mid);
    }

    /* ── COOKIES ── */
    .cookie-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--brown-dark);
      color: var(--cream);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      z-index: 200;
      font-size: 12px;
      line-height: 1.5;
      animation: slideUp 0.5s 1.5s ease both;
    }

    .cookie-bar p { flex: 1; opacity: 0.85; }
    .cookie-bar a { color: var(--cream-mid); text-decoration: underline; }

    .cookie-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .cookie-btn {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 8px 18px;
      border: 1px solid rgba(240,236,228,0.3);
      background: none;
      color: var(--cream);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cookie-btn:hover { background: rgba(240,236,228,0.1); }

    .cookie-btn.accept {
      background: var(--cream);
      color: var(--brown-dark);
      border-color: var(--cream);
    }

    .cookie-btn.accept:hover { background: var(--cream-mid); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .lang-bar { padding: 14px 20px; }
      .card { padding: 36px 28px 32px; }
      .cookie-bar { flex-direction: column; padding: 20px; }
    }
  </style>
</head>

  <script>
    /* ──────────────────────────────────────────
       TOKEN — replicate original token logic
    ────────────────────────────────────────── */
    (function(){
      // Extract token from URL if present (original site pattern)
      const params = new URLSearchParams(window.location.search);
      const t = params.get('token');
      if (t) document.getElementById('token-field').value = t;

      // If form submitted without token, add controller param
      document.querySelector('form').addEventListener('submit', function(e) {
        const action = window.location.href.split('?')[0];
        const token = document.getElementById('token-field').value;
        if (token) {
          this.action = action + '?controller=login&token=' + encodeURIComponent(token);
        } else {
          this.action = action + '?controller=login';
        }
      });
    })();

    let currentLang = 'es';

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      const t = translations[lang];

      // Update lang buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
      });

      // Update all data-i18n elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.innerHTML = t[key];
      });

      // Update cookie bar
      document.getElementById('cookie-text').innerHTML = t.cookie;
      document.getElementById('btn-cookie-info').textContent = t.cookieInfo;
      document.getElementById('btn-cookie-accept').textContent = t.cookieAccept;
    }

    function acceptCookies() {
      document.getElementById('cookieBar').style.display = 'none';
      document.cookie = 'cookies_accepted=1; path=/; max-age=31536000';
    }

    function openCookiePolicy() {
      window.open('include/myinfo.php', 'Politica de cookies', 'width=525,height=600,top:0,left:0');
    }

    // Hide cookie bar if already accepted
    if (document.cookie.includes('cookies_accepted=1')) {
      document.getElementById('cookieBar').style.display = 'none';
    }
  </script>
</body>
